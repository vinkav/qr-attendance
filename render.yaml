# Необов’язково: Render часто вимагає банківську картку.
# Рекомендований демо без картки: Neon + Vercel — див. DEPLOY.md
# Після деплою вкажіть URL API у Vercel як API_URL
services:
  - type: web
    name: qr-attendance-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run build && npx prisma db push --accept-data-loss && npm run db:seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qr-attendance-db
          property: connectionString

databases:
  - name: qr-attendance-db
    plan: free
    databaseName: qr_attendance
    user: qr_attendance
